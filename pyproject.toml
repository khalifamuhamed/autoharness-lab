[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoharness-lab"
version = "0.1.0"
description = "Personal demo harness built on top of Autoharness (Tigerless Labs, MIT): scripted Claude Code sessions + an Arabic HTML report of learned skills."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "muhamed khalifa" }]
# Deliberately EMPTY. Autoharness is not a pip package (and the PyPI project named "autoharness" is an
# unrelated project). It is a Claude Code plugin, declared and pinned below and in autoharness.pin.json.
dependencies = []

[project.scripts]
autoharness-lab = "autoharness_lab.cli:main"

[tool.setuptools]
packages = ["autoharness_lab"]

[tool.setuptools.package-data]
autoharness_lab = ["scenarios.json"]

# Declared external (non-pip) dependency. Single source of truth: autoharness.pin.json
[tool.autoharness-lab.external-dependency]
name = "autoharness"
kind = "claude-code-plugin"
install = "claude plugin install autoharness@autoharness-lab-pins"
upstream = "https://github.com/tigerless-labs/autoharness"
license = "MIT"
version = "0.5.3"
commit = "92015c0b2583072d892b54ab83352ad3490c0a7f"
